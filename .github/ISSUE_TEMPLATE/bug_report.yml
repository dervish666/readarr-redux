name: Bug Report
description: 'Report a bug in Readarr Redux. For setup questions, use Discussions.'
labels: ['bug']
body:
- type: markdown
  attributes:
    value: |
      Readarr Redux is an unofficial fork. Please don't report its bugs to the Readarr or Servarr teams.
- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if an open or closed issue already exists for the bug you encountered.
    options:
    - label: I have searched the existing open and closed issues
      required: true
- type: textarea
  attributes:
    label: Current Behavior
    description: A concise description of what you're experiencing.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: A concise description of what you expected to happen.
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps To Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. In this environment...
      2. With this config...
      3. Run '...'
      4. See error...
  validations:
    required: false
- type: input
  attributes:
    label: Readarr Redux version
    description: The version from System > Status, or the image tag you run (for example `0.5.0.14` or `latest`).
  validations:
    required: true
- type: dropdown
  attributes:
    label: Metadata source
    description: What Settings > Metadata Source points at. Don't paste the URL if it contains a key or password.
    options:
      - Self-hosted rreading-glasses
      - A public rreading-glasses instance
      - Something else
      - Not set
  validations:
    required: true
- type: textarea
  attributes:
    label: Environment
    description: |
      examples:
        - **OS**: Ubuntu 24.04
        - **Install**: Docker (ghcr.io/dervish666/readarr), or built from source
        - **Using Reverse Proxy**: No
        - **Browser**: Firefox 130 (if UI related)
        - **Database**: SQLite or Postgres
    value: |
        - OS:
        - Install:
        - Using Reverse Proxy:
        - Browser:
        - Database:
    render: markdown
  validations:
    required: true
- type: textarea
  attributes:
    label: Trace Logs?
    description: |
      Trace logs (https://wiki.servarr.com/readarr/troubleshooting#logging-and-log-files, the upstream wiki still applies).
      ***Generally speaking, all bug reports must have trace logs provided.*** Check them for API keys and URLs with credentials before you paste.
      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
      Additionally, any additional info? Screenshots? References? Anything that will give us more context about the issue you are encountering!
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Trace Logs have been provided as applicable. Reports may be closed if the required logs are not provided.
    description: Trace logs are generally required for all bug reports and contain `trace`. Info logs are invalid for bug reports and do not contain `debug` nor `trace`
    options:
    - label: I have read and followed the steps in the wiki link above and provided the required trace logs - the logs contain `trace` - that are relevant and show this issue.
      required: true
