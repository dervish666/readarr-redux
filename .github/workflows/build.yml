name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.402'
  NODE_VERSION: '24'
  BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 120000

      - name: Lint
        run: |
          yarn lint
          yarn stylelint-linux

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: _output/UI
          if-no-files-found: error
          retention-days: 1

  backend:
    needs: frontend
    runs-on: ubuntu-24.04
    env:
      # ImageSharp 4 needs it to build; empty on pull requests from forks, which get no secrets
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # READARRVERSION, read by src/Directory.Build.props: 0.5.0.<run>, or X.Y.Z.<run> for a vX.Y.Z tag
      - name: Version
        run: ./.github/release-version.sh >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Without this the newest SDK preinstalled on the runner would do the build
      - name: Pin SDK
        run: echo "{\"sdk\":{\"version\":\"$DOTNET_VERSION\"}}" > global.json

      - name: Build
        run: ./build.sh --backend -r ${{ matrix.rid }} -f net10.0

      # The arm64 test assemblies cannot run on an x64 runner
      - name: Unit tests
        if: matrix.rid == 'linux-x64'
        run: |
          tests=_tests/net10.0/linux-x64/publish
          find "$tests" -name Readarr.Test.Dummy -exec chmod a+x {} \;
          TEST_DIR="$tests" "$tests/test.sh" Linux Unit Test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.rid == 'linux-x64'
        with:
          name: unit-test-results
          path: TestResult.xml
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui
          path: _output/UI

      - name: Package
        env:
          RID: ${{ matrix.rid }}
        run: |
          ./build.sh --packages -r "$RID" -f net10.0
          name="Readarr.${BUILD_SOURCEBRANCHNAME//\//-}.${READARRVERSION}.linux-core-${RID#linux-}.tar.gz"
          tar -czf "$name" -C "_artifacts/$RID/net10.0" Readarr
          sha256sum "$name" > "$name.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Readarr-${{ matrix.rid }}
          path: Readarr.*.tar.gz*
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: backend
    # Publish only from the default branch and from tags
    if: >-
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    # Queue image pushes per ref so an older run can't finish last and leave `latest` on an older commit
    concurrency:
      group: docker-${{ github.ref }}
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub is skipped until both secrets are set, so GHCR publishing never depends on it
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'dervish/readarr-redux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # READARRVERSION, read by src/Directory.Build.props: 0.5.0.<run>, or X.Y.Z.<run> for a vX.Y.Z tag
      - name: Version
        run: ./.github/release-version.sh >> "$GITHUB_ENV"

      # GHCR image names must be lower case
      - name: Image names
        run: |
          {
            echo 'IMAGES<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/readarr"
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/$DOCKERHUB_IMAGE"
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # `latest` is the newest release tag (v1.2.3, not a pre-release such as v1.2.3-rc.1), and `develop` follows
      # the default branch. Every build also gets its own 0.5.0.<run> (or 1.2.3.<run>) tag.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGES }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=${{ env.READARRVERSION }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A build secret, so the key never lands in an image layer or the build args
          secrets: |
            SIXLABORS_LICENSE_KEY=${{ secrets.SIXLABORS_LICENSE_KEY }}
          build-args: |
            READARRVERSION=${{ env.READARRVERSION }}
            BUILD_SOURCEBRANCHNAME=${{ github.ref_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub description
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: Ebook and audiobook manager, an unofficial continuation of Readarr
          readme-filepath: distribution/docker/README.md

  release:
    needs: docker
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Readarr-linux-*
          merge-multiple: true

      # A draft, so the notes can be written from CHANGELOG.md before it goes out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --draft $prerelease --verify-tag --title "$TAG" \
            --notes "Docker: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/readarr:${TAG#v}\`. See CHANGELOG.md for what changed." \
            Readarr.*.tar.gz Readarr.*.tar.gz.sha256
